{% extends "admin/base.html" %}
{% block page_title %}Parcerias{% endblock %}
{% block content %}
<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th>Nome</th><th>Discord</th><th>Tipo</th><th>Link</th><th>Status</th></tr></thead>
    <tbody>
      {% for p in items %}
      <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.discord }}</td>
        <td>{{ p.type }}</td>
        <td>{% if p.link %}<a href="{{ p.link }}" target="_blank">link</a>{% else %}—{% endif %}</td>
        <td>
          <form method="post" action="{{ url_for('admin_parceria_status', pid=p.id) }}" class="inline-form">
            <select name="status" onchange="this.form.submit()">
              <option value="pendente" {{ 'selected' if p.status=='pendente' }}>Pendente</option>
              <option value="aprovado" {{ 'selected' if p.status=='aprovado' }}>Aprovado</option>
              <option value="recusado" {{ 'selected' if p.status=='recusado' }}>Recusado</option>
            </select>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="muted">Nenhuma proposta ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
