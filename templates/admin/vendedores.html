{% extends "admin/base_admin.html" %}
{% block title %}Vendedores — Admin{% endblock %}
{% block admin_content %}

<details class="card" style="padding:16px; margin-bottom:20px;" open>
  <summary style="cursor:pointer; font-weight:700;">➕ Criar vendedor</summary>
  <form method="post" action="{{ url_for('admin_vendedor_novo') }}" style="margin-top:14px; max-width:360px;">
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Criar vendedor</button>
  </form>
</details>

<div class="table-wrap">
  <table>
    <thead><tr><th>Usuário</th><th>Criado em</th><th>Ações</th></tr></thead>
    <tbody>
      {% for v in vendedores %}
      <tr>
        <td>{{ v['username'] }}</td>
        <td>{{ v['created_at'] }}</td>
        <td>
          <form method="post" action="{{ url_for('admin_vendedor_excluir', user_id=v['id']) }}" onsubmit="return confirm('Remover o acesso deste vendedor?');">
            <button class="btn btn-danger btn-sm" type="submit">Remover</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" style="color:var(--text-dim);">Nenhum vendedor cadastrado ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
