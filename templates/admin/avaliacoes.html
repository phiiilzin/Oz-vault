{% extends "admin/base.html" %}
{% block page_title %}Avaliações{% endblock %}
{% block content %}
<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th>Usuário</th><th>Nota</th><th>Comentário</th><th>Data</th></tr></thead>
    <tbody>
      {% for r in reviews %}
      <tr>
        <td>{{ r.username }}</td>
        <td>{{ r.rating }}/10</td>
        <td>{{ r.comment }}</td>
        <td>{{ r.created_at }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">Nenhuma avaliação ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
