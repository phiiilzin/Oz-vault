{% extends "base.html" %}
{% block title %}Suporte — {{ store_name }}{% endblock %}
{% block content %}
<section class="section support-page">
  <h1 class="page-title">🎧 Precisa de ajuda?</h1>
  <p class="muted">Escolha uma opção e abra um ticket. Nossa equipe vai te atender em breve.</p>

  <form method="post" class="support-form">
    <div class="support-options">
      <label class="support-option">
        <input type="radio" name="subject_type" value="comprar" checked>
        <span>🛒 Comprar Estoque</span>
      </label>
      <label class="support-option">
        <input type="radio" name="subject_type" value="suporte">
        <span>🔧 Suporte</span>
      </label>
      <label class="support-option">
        <input type="radio" name="subject_type" value="parceria">
        <span>🤝 Parceria</span>
      </label>
      <label class="support-option">
        <input type="radio" name="subject_type" value="outro">
        <span>❓ Outro</span>
      </label>
    </div>
    <textarea name="subject" placeholder="Descreva o que você precisa..." required></textarea>
    <button class="btn btn-primary" type="submit">Abrir Ticket</button>
  </form>
</section>
{% endblock %}
