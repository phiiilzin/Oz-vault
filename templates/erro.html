{% extends "base.html" %}
{% block title %}{{ code }} — {{ store_name }}{% endblock %}
{% block content %}
<section class="section container" style="text-align:center; padding:80px 20px;">
  <h1 style="font-size:4rem; margin:0; background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;">{{ code }}</h1>
  <p style="color:var(--text-dim); margin:10px 0 24px;">{{ message }}</p>
  <a href="{{ url_for('home') }}" class="btn btn-primary">Voltar para a Home</a>
</section>
{% endblock %}
