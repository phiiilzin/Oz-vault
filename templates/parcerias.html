{% extends "base.html" %}
{% block title %}Parcerias — {{ store_name }}{% endblock %}
{% block content %}
<section class="section">
  <h1 class="page-title">🤝 Parcerias</h1>
  <p class="muted">Tem um servidor ou canal e quer fazer parceria com a {{ store_name }}? Envie sua proposta.</p>

  <form method="post" class="simple-form">
    <label>Nome
      <input type="text" name="name" required>
    </label>
    <label>Discord
      <input type="text" name="discord" required placeholder="usuario ou link do servidor">
    </label>
    <label>Tipo de parceria
      <input type="text" name="type" placeholder="Ex: divulgação, afiliados...">
    </label>
    <label>Descrição
      <textarea name="description" required></textarea>
    </label>
    <label>Link
      <input type="url" name="link" placeholder="https://...">
    </label>
    <button class="btn btn-primary" type="submit">Enviar</button>
  </form>
</section>
{% endblock %}
