{% extends "base.html" %}
{% block title %}Parcerias — {{ store_name }}{% endblock %}
{% block content %}
<section class="section container">
  <h2 class="section-title">🤝 Parcerias</h2>
  <p style="color:var(--text-dim); margin-top:-10px;">Quer fazer parceria com a {{ store_name }}? Preencha o formulário abaixo.</p>

  <form method="post" class="form-card">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Discord</label>
      <input type="text" name="discord_user" required>
    </div>
    <div class="form-group">
      <label>Tipo de parceria</label>
      <input type="text" name="partnership_type" placeholder="Ex: Divulgação, afiliado, servidor parceiro...">
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea name="description" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Link (servidor, site, etc.)</label>
      <input type="url" name="link" placeholder="https://...">
    </div>
    <button class="btn btn-primary btn-block" type="submit">ENVIAR</button>
  </form>
</section>
{% endblock %}
