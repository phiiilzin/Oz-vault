{% extends "base.html" %}
{% block title %}Login — {{ store_name }}{% endblock %}
{% block content %}
<section class="section container">
  <div class="form-card">
    <h2 style="margin-top:0; text-align:center;">Acesso da equipe</h2>
    <p style="text-align:center; color:var(--text-dim); font-size:0.85rem; margin-top:-8px;">
      Login exclusivo para dono e vendedores. Contas são criadas pelo dono no painel.
    </p>
    <form method="post">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ENTRAR</button>
    </form>
  </div>
</section>
{% endblock %}
