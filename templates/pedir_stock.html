{% extends "base.html" %}
{% block title %}Pedir Stock — {{ store_name }}{% endblock %}
{% block content %}
<section class="section">
  <h1 class="page-title">📦 Solicitar Produtos para Estoque</h1>
  <p class="muted">Peça um novo produto para que a equipe avalie e adicione à loja. Há um cooldown de 3 minutos entre solicitações.</p>

  <form method="post" class="simple-form">
    <label>Produto desejado
      <input type="text" name="product_name" required placeholder="Nome claro do produto">
    </label>
    <label>Quantidade / descrição
      <textarea name="description" placeholder="Descreva as características relevantes e a quantidade desejada"></textarea>
    </label>
    <label>Link de referência (opcional)
      <input type="url" name="link" placeholder="https://...">
    </label>
    <button class="btn btn-primary" type="submit">📦 Enviar Pedido</button>
  </form>
</section>
{% endblock %}
